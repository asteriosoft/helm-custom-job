{{- if .Values.serviceAccount.created }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "custom-job.serviceAccount" . }}
  labels:
{{ include "custom-job.labels" . | indent 4 }}
  {{- if .Values.serviceAccount.annotations }}
  annotations:
  {{- range $key, $value := .Values.serviceAccount.annotations }}
    {{ $key }}: "{{ $value }}"
  {{- end }}
  {{- end }}
{{- end }}
