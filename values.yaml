# Default values for custom job.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## Image Info
# -- Docker image source
image: busybox
# -- Docker image tag
imageTag: latest

## Specify a imagePullPolicy
## ref: http://kubernetes.io/docs/user-guide/images/#pre-pulling-images
# -- Image pull policy
imagePullPolicy: IfNotPresent

## Specify an array of imagePullSecrets.
## Secrets must be manually created in the namespace.
## ref: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
# -- Image pull existing secret
imagePullSecrets:

job:
  # -- Create Job 
  enabled: true
  # -- Time after which completed jobs should be removed
  ttlSecondsAfterFinished: 90
  # -- The number of retries before considering a Job as failed
  backoffLimit: 4
  # -- [Restart policy](https://kubernetes.io/docs/concepts/workloads/controllers/job/#handling-pod-and-container-failures) of the job
  restartPolicy: "Never"

cronjob:
  # -- Create Cron Job
  enabled: false
  # -- Cron Job [schedule](https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#schedule-syntax)
  schedule: "0 0 * * *"
  # -- Specify how many completed Jobs should be kept
  successfulJobsHistoryLimit: 3
  # -- Specify how many failed Jobs should be kept
  failedJobsHistoryLimit: 3
  # -- [Restart policy](https://kubernetes.io/docs/concepts/workloads/controllers/job/#handling-pod-and-container-failures) of the job
  restartPolicy: "Never"

# -- Container environment variables
customEnv:
  # AWS_S3_BUCKET: "dummy-bucket"
  # AWS_S3_REGION: "eu-west2"

# -- Container environment variables placed in the secret
secretEnv:
  # AWS_ACCESS_KEY_ID: "dummy-key-id"
  # AWS_SECRET_ACCESS_KEY: "dummy-acces-key"

# -- A plain text script that will be executed when the job is started
script: |
#   #!/bin/sh
#   echo "Hello world!"
#   echo "AWS region is $AWS_S3_REGION"

# -- Pod resources definition
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

## List of volumeMounts for application container
## ref: https://kubernetes.io/docs/concepts/storage/volumes/
# -- Container volume mounts definition
volumeMounts:
  # - name: credentials
  #   mountPath: /etc/creds-volume
  # - name: gcp-sa-key
  #   mountPath: /opt/gcp-sa-key.json
  #   subPath: gcp-sa-key.json

## List of volumeMounts for application container
## ref: https://kubernetes.io/docs/concepts/storage/volumes/
# -- Pod volumes definition
volumes:
  # - name: credentials
  #   secret:
  #     secretName: creds
  # - name: gcp-sa-key
  #   secret:
  #     secretName: gcp-sa-key

## Node labels for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
# -- Pod's [node selector](https://kubernetes.io/docs/concepts/configuration/assign-pod-node/)
nodeSelector: {}
